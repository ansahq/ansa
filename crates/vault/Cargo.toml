[package]
name = "ansa-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OS-backed secret sealing and encrypted payload storage for Ansa"

[lib]
name = "ansa_vault"
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5.19", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3"
