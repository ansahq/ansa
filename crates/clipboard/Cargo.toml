[package]
name = "ansa-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clipboard capture, filtering and safe insertion transactions for Ansa"

[lib]
name = "ansa_clipboard"
path = "src/lib.rs"

[dependencies]
ansa-vault = { path = "../vault", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "net", "pipe"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["xfixes"] }
x11rb-protocol = "0.13.2"

[dev-dependencies]
tempfile = "3"
