[package]
name = "ansa-platform-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Windows Start Menu application catalog and ShellExecute launcher for Ansa"
license = "Apache-2.0"
publish = false

[lib]
name = "ansa_platform_windows"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Graphics_Effects",
    "System",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_Graphics_Dwm",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
