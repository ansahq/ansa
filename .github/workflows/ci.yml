name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"

jobs:
  reuse-tooling:
    name: Reuse probe safety tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test synthetic checkout and process safety
        shell: pwsh
        run: pwsh -NoProfile -File scripts/reuse/tests/run-tests.ps1

  reference:
    name: Reference ledger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reference schema, coverage and evidence boundaries
        run: python scripts/reference/validate_reference.py --root .
      - name: Test reference validator rejection paths
        run: python scripts/reference/test_validate_reference.py

  format-and-inventory:
    name: Format and locked inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Fetch all locked dependencies for every inventory filter
        run: |
          cargo fetch --locked
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-apple-darwin
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-unknown-linux-gnu

      - name: Run dependency tooling tests (includes stale-lock negative test)
        run: python -m unittest discover -s scripts/dependencies/tests -v

      - name: Check generated dependency inventory
        run: python scripts/dependencies/inventory.py --check

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python for native smoke tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-cargo-locked
          cache-on-failure: false

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxcb-shm0-dev libxcb-util-dev libxcb-image0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri \
            xvfb xauth vulkan-tools

      - name: Fetch all locked dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --lib --bins --tests --locked --offline

      - name: Doctests
        run: cargo test --workspace --doc --locked --offline

      - name: Build native desktop
        run: cargo build -p ansa-desktop --locked --offline

      - name: Test native smoke helper
        run: python -m unittest discover -s scripts/build/tests -v

      - name: Native startup smoke (Linux, Xvfb and software Vulkan)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_BACKTRACE: "1"
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit 2>/dev/null || true)"
          if [ -n "$ICD" ]; then
            export VK_ICD_FILENAMES="$ICD"
            export VK_DRIVER_FILES="$ICD"
          fi
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python scripts/build/native_smoke.py --timeout 120

      - name: Native startup smoke (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          RUST_BACKTRACE: "1"
        run: python scripts/build/native_smoke.py --timeout 120

      - name: Upload native smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ runner.os }}
          path: target/native-smoke/
          if-no-files-found: ignore
          retention-days: 7
