[package]
name = "ansa-ui-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Only the isolated experiment workspace enables this against the immutable
# upstream GPUI candidate. It must never be enabled for the crates.io pin.
upstream-candidate = ["ansa-ui-components/upstream-candidate"]

[dependencies]
gpui.workspace = true
async-channel = "=2.5.0"
ansa-ui-components = { path = "../ui-components" }
ansa-core = { path = "../core" }
ansa-domain = { path = "../domain" }
ansa-platform-api = { path = "../platform-api" }
ansa-alpha = { path = "../alpha" }
ansa-onboarding = { path = "../onboarding" }
ansa-storage = { path = "../storage" }

[target.'cfg(windows)'.dependencies]
ansa-platform-windows = { path = "../platform-windows" }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
tempfile = "3"
ansa-quicklinks = { path = "../quicklinks" }
