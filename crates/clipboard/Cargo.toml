[package]
name = "ansa-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clipboard capture, filtering and safe insertion transactions for Ansa"

[lib]
name = "ansa_clipboard"
path = "src/lib.rs"

[dependencies]
ansa-vault = { path = "../vault", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
