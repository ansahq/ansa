name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo check --locked -p ansa-desktop
      - run: cargo test --locked -p ansa-ui-components
      - run: cargo clippy --all-targets --locked -p ansa-desktop -p ansa-ui-components -- -D warnings
