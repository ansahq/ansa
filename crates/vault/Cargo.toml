[package]
name = "ansa-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OS-backed secret sealing and encrypted payload storage for Ansa"

[lib]
name = "ansa_vault"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
